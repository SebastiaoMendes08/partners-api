services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: partners-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "Partners!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - partners-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: partners-cloudbeaver
    ports:
      - "8978:8978"
    volumes:
      - partners-cloudbeaver-data:/opt/cloudbeaver/workspace
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  partners-sqldata:
  partners-cloudbeaver-data:
